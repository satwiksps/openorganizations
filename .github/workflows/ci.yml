name: Validate and build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://openorganizations.site' }}
      GATSBY_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - run: pnpm data:validate
      - name: Save build metadata and downloadable source
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata-${{ github.run_id }}
          path: |
            public/sitemap.xml
            public/robots.txt
            public/source.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
